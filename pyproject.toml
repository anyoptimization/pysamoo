[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (deselected by the default test tier)",
    "integration: cross-component integration tests",
    "golden: behavior-regression baseline tests",
]

[tool.ruff]
# Default scope for `ruff check` / `ruff format` when no path is given.
src = ["src"]
include = ["src/**/*.py", "tests/**/*.py"]
extend-exclude = [
    "src/pysamoo/vendor",
    "src/pysamoo/usage",
    "src/pysamoo/experimental",
    "tests/_golden_plugin.py",  # vendored, generated by `pyclawd golden vendor`
]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Conservative default rule set for an existing codebase.
select = ["E", "F", "W", "I"]
# E501: long lines; E741: `I`/`l`/`O` are idiomatic index/array names in this
# numpy-heavy optimization code.
ignore = ["E501", "E741"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
follow_imports = "silent"
# Legacy signatures use `x: T = None`; keep the pre-PEP-484 implicit-Optional rule.
implicit_optional = true
exclude = ["src/pysamoo/vendor", "src/pysamoo/usage", "src/pysamoo/experimental"]
